name: aries_ui
description: Aries AI re0 Flutter UI shell.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# Flutter SDK is intentionally not vendored. Install Flutter 3.x to run this package.
dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  drift: ^2.24.0
  file_selector: ^1.1.0
  # 0.5.2+5 uses the same unresolved Kotlin DSL Flutter accessor as the host.
  file_selector_android: 0.5.2+4
  mime: ^2.0.0
  shared_preferences: ^2.5.5
  # 2.4.22+ uses a Kotlin DSL accessor that is not resolved by this add-to-app host.
  shared_preferences_android: 2.4.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  pigeon: ^22.7.4

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: com.ai.phoneagent.re0.flutter
    iosBundleIdentifier: com.ai.phoneagent.re0.flutter
