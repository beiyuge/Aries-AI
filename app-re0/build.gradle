plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.ai.phoneagent.re0'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ai.phoneagent.re0'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '0.1.0-re0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

flutter {
    source '../flutter/aries_ui'
}

dependencies {
    implementation project(':core:capability-api')
    implementation project(':platform:android:capability-runtime')
    implementation project(':platform:android:permissions')
    implementation project(':platform:android:shizuku')
    implementation project(':platform:android:accessibility')
    implementation project(':platform:android:screen')
    implementation project(':platform:android:input')
    implementation project(':platform:android:virtualdisplay')
    implementation project(':platform:android:floating')
    implementation project(':platform:android:background')
    implementation project(':platform:android:native-runtime')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.material
}
